symbols:
 # - EURUSD
#  - GBPUSD
 # - USDCAD
  - XAUUSDm
  - BTCUSDm
  #- US30
 # - USTECH
  

indicators:
  adx_trend_threshold: 20.0        # Very low
  rsi_buy_ceiling: 65.0            # Very high
  rsi_sell_floor: 35.0             # Very low

divergence:
  lookback: 40
  tolerance: 0.02
  strict: false                    # Disabled

candlestick:
  enabled: true         # score bonus/penalty when a hammer/hangman/doji/three-
                         # soldiers/three-crows/star pattern agrees or disagrees
                         # with a BUY/SELL that already passed the core ADX/EMA/
                         # RSI/MACD/H4 rules. Never triggers a trade by itself.

fibonacci:
  enabled: true
  lookback: 50                     # bars used to find the swing high/low to retrace
  tolerance_atr_fraction: 0.25     # how close (in ATRs) price must be to a level to count

trade_management:
  enabled: true
  mode: quick_profit                          # "trail" (breakeven then trailing stop) | "quick_profit" (close
                                        # a position outright the instant its real floating profit hits
                                        # quick_profit_usd - see trade_manager.py). SL from RiskManager
                                        # still caps the downside either way; this only changes the exit.
  quick_profit_usd: 1.0                # only used when mode: quick_profit
  breakeven_atr_multiplier: 1.0        # move SL to breakeven once price has moved this many ATRs in our favour
  breakeven_buffer_atr_fraction: 0.1   # small buffer past exact breakeven (covers spread/commission), in ATRs
  trail_start_atr_multiplier: 1.5      # once favourable move reaches this many ATRs, start trailing
  trail_distance_atr_multiplier: 1.0   # trail this many ATRs behind current price

risk:
  risk_per_trade: 0.005
  atr_sl_multiplier: 1.5
  atr_tp_multiplier: 3.0
  cooldown_minutes: 60
  max_positions: 10
  allow_multiple_positions_per_symbol: true   # true = allow pyramiding into the same symbol

trading_hours:
  start_hour_utc: 0
  end_hour_utc: 24

runtime:
  loop_interval_seconds: 5
  bars_to_fetch: 300
  dry_run: false
  close_positions_on_exit: true

strategy:
  mode: swing   # "swing" | "scalp" | "divergence" | "trendline" | "sr" | "combo"
 
scalp:
  entry_timeframe: M1
  trend_timeframe: M15
  ema_fast: 9
  ema_slow: 21
  rsi_period: 7
  adx_threshold: 15.0
  atr_sl_multiplier: 0.8
  atr_tp_multiplier: 1.2
  cooldown_minutes: 5
  loop_interval_seconds: 5
  max_spread_points: 20.0   # skip the trade if current spread exceeds this many points

divergence_strategy:
  oscillator: RSI            # "RSI" | "MACD" | "OBV" | "any_two"
  lookback_bars: 60          # not in the original spec — bounds the swing search window
  min_swing_gap_bars: 5
  require_confirmation_bars: 1   # bars to wait after the swing before signalling
  strength_threshold: 1          # 1 = weak ok, 2 = only strong divergences

trendline_strategy:
  swing_lookback: 50
  min_swings_required: 3         # need at least this many swings to fit a line
  min_r_squared: 0.75            # reject the line if swings don't line up
  touch_atr_fraction: 0.25       # price within this many ATRs of the line = "touch"
  break_atr_fraction: 0.30       # price beyond the line by this = confirmed break
  require_slope_direction: true  # only signal on breaks that go against the slope

sr_strategy:
  lookback: 100
  cluster_atr_fraction: 0.25     # merge levels within this many ATRs
  min_touches: 2
  approach_atr_fraction: 0.5     # price within this of a zone = "approaching"
  break_atr_fraction: 0.3        # close beyond zone by this = confirmed break
  max_zones: 6                   # keep this many strongest zones
  flip_persist_bars: 20          # not in the original spec — how many closed H1
                                  # bars a broken zone keeps its flipped role for